name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/layertree_ref.py
      - run: python3 tools/test_scripts.py
      - run: python3 tools/test_mid.py
      - run: python3 tools/test_min.py
      - run: python3 tools/test_ccv.py
      - run: python3 tools/test_msu.py
      - run: python3 tools/test_chan.py
      - run: python3 tools/gen_golden.py && git diff --exit-code spec/golden.json spec/test-vectors.json
  go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go build ./... && go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          use-mathlib-cache: false
      - run: cd formal && lake build 2>&1 | tee build.log && ! grep -q sorryAx build.log
